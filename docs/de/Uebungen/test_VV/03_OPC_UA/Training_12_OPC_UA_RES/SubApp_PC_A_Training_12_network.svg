  <text x="65.0" y="-69.3" font-family="'TGL 0-17_std', 'TGL 0-17', 'Times New Roman', Times, serif" font-size="12" font-weight="bold" fill="#333333">Geraet A (Station 11, 192.168.1.11): wie Training_11, aber Transport-Layer
gebuendelt - statt je 2x AX_SUBSCRIBE_1/AX_CLIENT_1_0 (4 einzelne
Netzwerk-Bausteine, 4 Konstanten) uebernimmt EIN A2X2_CLIENT_2_0_SUBSCRIBE_2
(Socket) den kompletten Roundtrip fuer UP+DOWN in je einem
CLIENT_2_0/SUBSCRIBE_2 (2 Werte pro Aufruf, 2 Konstanten). Die 4 lokalen
Bausteine (2 SoftKeys + 2 GreenWhiteBackground) stecken gebuendelt in
MyLib::sys::Softkey2_TO_A2X2_BG, das nach aussen nur einen einzigen A2X2-Plug
zeigt - dieser wird direkt in den Netzwerk-Baustein gesteckt.</text>
